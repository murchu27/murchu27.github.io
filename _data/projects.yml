# Projects
- project: TCGPDeckGenie
  role: Portfolio Project
  duration: 2026
  url: "https://github.com/murchu27/TCGPDeckGenie"
  description: >-
    <ul class="resume-item-list">
    <li>CLI-based app that designs Pokémon TCG Pocket decks from natural-language briefs using Gemini (free tier).</li>
    <li>Uses TCGdex SDK for knowledge of cards and solo-battle missions, for which it can build counter decks.</li>
    <li>Responses grounded by Pydantic structured output. CLI powered by Click CLI.</li>
    </ul>

- project: GroundedDoc
  role: Portfolio Project
  duration: 2026
  url: "https://github.com/murchu27/GroundedDoc"
  description: >-
    <ul class="resume-item-list">
    <li>CLI-based app that answers questions over document collections with checkable citations & conflict awareness.</li>
    <li>Aimed at analysing privacy policies against regulatory corpora (e.g., PIPEDA, GDPR).</li>
    <li>Deploys on GCP Cloud Run, served via FastAPI, with a browser extension front-end for sending requests.</li>
    </ul>

